# Model endpoints. Every entry is an OpenAI-compatible chat endpoint.
#
# Fields
#   model                 model id sent in the request
#   base_url_env          name of the environment variable holding the endpoint URL
#                         (private deployments stay out of the repo); or
#   base_url              a literal URL, which may contain ${VAR} placeholders
#   auth: modal           key = $<token_prefix>PROXY_TOKEN_ID . $<token_prefix>PROXY_TOKEN_SECRET
#                         (token_prefix defaults to MODAL_)
#   auth: openrouter      key = the environment variable named by api_key_env
#   temperature, top_p    sampling
#   extra_body            provider-specific request fields (reasoning switches)
#   max_tokens_multiplier the per-call token budget is max_tokens x this; a reply that is
#                         empty because reasoning used the budget is retried with
#                         retry_tokens_growth (default 2) x the budget, up to max_tokens_cap
#   timeout               seconds per call
#   price_per_m_*         USD per 1M tokens, only for the usage estimate (null = unknown)
#
# Roles in the reported runs: qwen = agents and claims extractor, glm = judge for
# the five views, or_* = agent families of the model panel (judged by glm).
# To run two Modal workspaces in one process (e.g. agents on one, judge on the
# other), duplicate an entry with token_prefix: MODAL3_ and base_url_env:
# MODAL3_QWEN_BASE_URL and set the matching variables in .env.

models:
  # ---- Modal deployments (URLs and tokens from .env) ----
  glm:
    model: zai-org/GLM-5.3
    base_url_env: MODAL_GLM_BASE_URL
    auth: modal
    token_prefix: MODAL_
    temperature: 0.7
    top_p: 0.9
    extra_body: {reasoning: {enabled: false}}
    # The deployment used for the reported runs ignores every "thinking off" flag
    # (reasoning.enabled, chat_template_kwargs.enable_thinking, thinking.type,
    # reasoning_effort) and always reasons first (1.2k-6k output tokens per call).
    # The multiplier makes room for that; with 1 the JSON never arrives. Drop
    # back to 1 once thinking can be disabled server-side.
    max_tokens_multiplier: 20
    max_tokens_cap: 32000
    timeout: 600          # judge and extraction calls reason for minutes
    price_per_m_input: null
    price_per_m_output: null

  glm_reason:           # same model with native reasoning requested (small subsets only)
    model: zai-org/GLM-5.3
    base_url_env: MODAL_GLM_BASE_URL
    auth: modal
    token_prefix: MODAL_
    temperature: 0.7
    top_p: 0.9
    extra_body: {reasoning: {enabled: true}}
    max_tokens_multiplier: 8
    price_per_m_input: null
    price_per_m_output: null

  qwen:                 # agents of the main runs; also the claims extractor
    model: Qwen/Qwen3.8-2.4T-A95B
    base_url_env: MODAL_QWEN_BASE_URL
    auth: modal
    token_prefix: MODAL_
    temperature: 0.3
    top_p: 0.95
    extra_body: {reasoning_effort: low}
    max_tokens_multiplier: 4
    price_per_m_input: null
    price_per_m_output: null

  # ---- OpenRouter agent panel (results/model_panel) ----
  # Same sampling as the Qwen agents (temperature 0.3, top_p 0.95, strict JSON
  # schema); reasoning set to the lowest level each model allows. Prices from
  # the OpenRouter catalogue on 24 Oct 2026. Providers that rate-limit bursts
  # (Mistral) need `grid --parallel-runs 1`.
  or_gptoss:            # OpenAI family (open-weight), reasoning effort low
    model: openai/gpt-oss-120b
    base_url: https://openrouter.ai/api/v1
    auth: openrouter
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.3
    top_p: 0.95
    extra_body: {reasoning: {effort: low}}
    max_tokens_multiplier: 8
    timeout: 180
    price_per_m_input: 0.15
    price_per_m_output: 0.60
  or_gemini:            # Google family, reasoning effort low
    model: google/gemini-3.1-flash-lite
    base_url: https://openrouter.ai/api/v1
    auth: openrouter
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.3
    top_p: 0.95
    extra_body: {reasoning: {effort: low}}
    max_tokens_multiplier: 8
    timeout: 180
    price_per_m_input: 0.25
    price_per_m_output: 1.50
  or_deepseek:          # DeepSeek family, thinking off
    model: deepseek/deepseek-v4-flash
    base_url: https://openrouter.ai/api/v1
    auth: openrouter
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.3
    top_p: 0.95
    extra_body: {reasoning: {enabled: false}}
    max_tokens_multiplier: 4
    timeout: 180
    price_per_m_input: 0.091
    price_per_m_output: 0.182
  or_llama:             # Meta family, no reasoning mode
    model: meta-llama/llama-4-maverick
    base_url: https://openrouter.ai/api/v1
    auth: openrouter
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.3
    top_p: 0.95
    max_tokens_multiplier: 4
    timeout: 180
    price_per_m_input: 0.188
    price_per_m_output: 0.652
  or_mistral:           # Mistral family, no reasoning mode
    model: mistralai/mistral-small-2603
    base_url: https://openrouter.ai/api/v1
    auth: openrouter
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.3
    top_p: 0.95
    max_tokens_multiplier: 4
    timeout: 180
    price_per_m_input: 0.15
    price_per_m_output: 0.60
  or_haiku:             # Anthropic family, extended thinking off (default)
    model: anthropic/claude-haiku-5.5
    base_url: https://openrouter.ai/api/v1
    auth: openrouter
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.3
    top_p: 0.95
    max_tokens_multiplier: 4
    timeout: 180
    price_per_m_input: 0.10
    price_per_m_output: 0.50

  # ---- offline stand-in that follows a scripted policy (tests, dry runs) ----
  mock:
    mock: true

# Hard stop: a process aborts once this many tokens (input + output, all models)
# have been used.
budget:
  max_total_tokens: 8000000
